name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # One flaky cell must not cancel the other 14: we need to see every failure
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 24 is the current LTS; 22 is maintenance LTS. 16/18 are kept
        # because package.json engines still declares >=16.
        node-version: [16.x, 18.x, 20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Run stress tests
      run: npm run test:stress
      timeout-minutes: 5

    - name: Generate coverage
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  benchmark:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    # The harness records the machine it ran on into every results file and
    # prints it above the table, so a number is never published without the
    # hardware it came from. A shared CI runner is noisy: expect some cases to
    # be flagged UNSTABLE here that are stable on a quiet machine. That is the
    # harness working, not failing — an UNSTABLE row is a row that must not be
    # quoted, so the job does not gate on it.
    - name: Run benchmarks
      run: |
        echo "Running benchmarks on GitHub Actions runner..."
        npm run benchmark
        npm run benchmark:compare
        npm run benchmark:memory
      timeout-minutes: 10

    - name: Store benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results/
      if: always()

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript
      run: npx tsc --noEmit

    - name: Lint code
      run: npm run lint || true

    - name: Check formatting
      run: npm run format:check || true

  packaging:
    # Guards the published artifact, which unit tests cannot: they import src/,
    # so they say nothing about what a consumer actually receives.
    #
    #   verify:provenance — dist/ is byte-identical to a fresh tsc run from src/
    #   verify:packaging  — packs the real tarball, installs it into throwaway
    #                       ESM and CommonJS consumers, then type-checks under
    #                       both "bundler" and "nodenext" and RUNS the result
    #
    # Runs on the engines floor and on current LTS, because module resolution
    # behaviour differs across Node majors.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Verify dist/ is exactly what tsc produced
      run: npm run verify:provenance

    - name: Verify the published artifact resolves for ESM and CommonJS
      run: npm run verify:packaging

  generate-reports:
    runs-on: ubuntu-latest
    needs: [test, benchmark, lint, packaging]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Generate all reports
      run: |
        # Generate test and coverage reports
        npm run test:coverage || true

        # Generate benchmark report
        npm run benchmark || true
        node scripts/generate-benchmark-report.js || true

        # Generate index page
        node scripts/generate-reports.js

    - name: Upload reports artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          reports/
          coverage/
        retention-days: 30

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: '📊 Deploy test reports for ${{ github.sha }}'

  publish:
    runs-on: ubuntu-latest
    needs: [test, benchmark, lint, packaging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Check if version changed
      id: version-check
      run: |
        # Get current version from package.json
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

        # Check if this version exists on npm
        if npm view @alexanderfedin/async-queue@$CURRENT_VERSION version 2>/dev/null; then
          echo "version-exists=true" >> $GITHUB_OUTPUT
          echo "Version $CURRENT_VERSION already exists on npm"
        else
          echo "version-exists=false" >> $GITHUB_OUTPUT
          echo "Version $CURRENT_VERSION is new, ready to publish"
        fi

    - name: Publish to npm
      if: steps.version-check.outputs.version-exists == 'false'
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}